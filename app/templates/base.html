<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATALAIA 3 - Análise Extrema & Telemetria Real-Time</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
  <div class="matrix-grid-overlay"></div>
  <div class="ambient-glow"></div>

  <nav class="top-nav">
    <div class="brand-title">
      <div class="pulse-indicator-core"></div>
      <div>
        <div class="brand-text-main">ATALAIA 3 // MATRIX OBSERVER</div>
        <div class="brand-subtitle">Estação Autônoma • Ingestão LittleFS & Telemetria Viva</div>
      </div>
    </div>

    <div class="nav-actions">
      <!-- Navegação Interna -->
      <a href="/" class="btn-action" style="text-decoration: none;">📊 DASHBOARD</a>
      <a href="/records" class="btn-action" style="text-decoration: none; border-color: rgba(168, 85, 247, 0.4); color: var(--accent-purple);">🗄️ GERIR REGISTOS</a>

      <button id="btnToggleSound" class="btn-action">
        <span id="soundIcon">🔊</span>
        <span id="soundText">SOM ATIVO</span>
      </button>

      <button id="btnCopyBuffer" class="btn-action">
        📥 COPIAR BUFFER
      </button>

      <button id="btnExtractBuffer" class="btn-action" style="color: var(--accent-rose); border-color: rgba(244, 63, 94, 0.4);">
        ⚡ EXTRAIR E PURGAR
      </button>

      <button id="btnOpenControl" class="btn-action" style="color: var(--accent-cyan);">
        🎮 ATUADORES ESP32
      </button>

      <span id="connStatusBadge" class="badge-status badge-connecting">CONECTANDO...</span>
    </div>
  </nav>

  <main class="main-container">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/indicators.js') }}"></script>
  <script src="{{ url_for('static', filename='js/charts_engine.js') }}"></script>
  <script src="{{ url_for('static', filename='js/filters.js') }}"></script>
  <script src="{{ url_for('static', filename='js/live_connection.js') }}"></script>
</body>
</html>
