<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ATALAIA 3 - Análise Extrema & Telemetria{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen overflow-x-hidden selection:bg-cyan-500 selection:text-black">
  <div class="matrix-grid-overlay"></div>
  <div class="ambient-glow"></div>

  <nav class="relative z-20 border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-xl px-6 py-4 flex flex-wrap justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="pulse-indicator-core"></div>
      <div>
        <h1 class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-400 bg-clip-text text-transparent">
          ATALAIA 3 // MATRIX
        </h1>
        <p class="text-xs text-slate-400 font-mono tracking-tight">Estação Headless • Telemetria & Derivados em Tempo Real</p>
      </div>
    </div>
    <div class="flex items-center gap-3 mt-2 sm:mt-0">
      <span id="connStatusBadge" class="badge-status badge-connecting">DESCONECTADO</span>
      <button id="btnSyncBuffer" class="btn-action btn-sync">Sincronizar Buffer Flash</button>
      <button id="btnOpenControl" class="btn-action btn-control">Hardware Actuators</button>
    </div>
  </nav>

  <main class="relative z-10 max-w-[1700px] mx-auto p-4 md:p-6 space-y-6">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/indicators.js') }}"></script>
  <script src="{{ url_for('static', filename='js/charts_engine.js') }}"></script>
  <script src="{{ url_for('static', filename='js/filters.js') }}"></script>
  <script src="{{ url_for('static', filename='js/live_connection.js') }}"></script>
</body>
</html>
