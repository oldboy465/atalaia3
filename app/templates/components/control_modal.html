<div id="modalControl" class="modal-overlay">
  <div class="modal-content">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(56, 189, 248, 0.3); padding-bottom: 12px;">
      <h3 style="font-size: 1.1rem; font-weight: 800; font-family: monospace; color: var(--accent-cyan);">
        🎮 ATUADORES REMOTOS // ESP32
      </h3>
      <button id="btnCloseModal" style="background: transparent; border: none; color: #94a3b8; font-size: 1.4rem; cursor: pointer;">&times;</button>
    </div>

    <div class="modal-grid-btns">
      <button class="btn-actuator" onclick="triggerHardware('buzzer5v')">
        <span style="color: var(--accent-amber); font-weight: bold; display: block; font-size: 0.85rem; font-family: monospace;">Bip Buzzer 5V (D27)</span>
        <span style="font-size: 0.7rem; color: var(--text-muted); font-family: monospace;">Pulso de 80ms a 2.7kHz</span>
      </button>

      <button class="btn-actuator" onclick="triggerHardware('siren')" style="border-color: rgba(244, 63, 94, 0.4);">
        <span style="color: var(--accent-rose); font-weight: bold; display: block; font-size: 0.85rem; font-family: monospace;">Sirene Fogo (D12)</span>
        <span style="font-size: 0.7rem; color: var(--text-muted); font-family: monospace;">Modulação 900-2200Hz</span>
      </button>

      <button class="btn-actuator" onclick="triggerHardware('melody')">
        <span style="color: var(--accent-emerald); font-weight: bold; display: block; font-size: 0.85rem; font-family: monospace;">Melodia Chuva (D12)</span>
        <span style="font-size: 0.7rem; color: var(--text-muted); font-family: monospace;">Jingle Bells Natalino</span>
      </button>

      <button class="btn-actuator" onclick="triggerHardware('toggle_led')">
        <span style="color: var(--accent-cyan); font-weight: bold; display: block; font-size: 0.85rem; font-family: monospace;">Alternar LED (D19)</span>
        <span style="font-size: 0.7rem; color: var(--text-muted); font-family: monospace;">Modo Manual ON/OFF</span>
      </button>
    </div>

    <button class="btn-action" style="width: 100%; justify-content: center;" onclick="triggerHardware('auto_led')">
      Restaurar Respiração Automática do LED Verde (PWM)
    </button>

    <div id="actuatorStatus" style="text-align: center; font-size: 0.75rem; font-family: monospace; color: var(--accent-cyan); margin-top: 14px; min-height: 18px;"></div>
  </div>
</div>
