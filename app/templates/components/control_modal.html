<!-- MODAL DE CONTROLE DIRETO DO HARDWARE ESP32 -->
<div id="modalControl" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
  <div class="glass-panel w-full max-w-lg p-6 border border-cyan-500/40 shadow-[0_0_50px_rgba(6,182,212,0.25)] relative transform transition-all duration-300 scale-95 opacity-0 modal-box">
    
    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></span>
        <h3 class="font-bold text-lg text-cyan-300 tracking-wide">ATUADORES REMOTOS // ESP32</h3>
      </div>
      <button id="btnCloseModal" class="text-slate-400 hover:text-white text-xl font-bold p-1">&times;</button>
    </div>

    <div class="py-5 space-y-4">
      <p class="text-xs text-slate-400 leading-relaxed">
        Dispare rotinas de teste e modulação sonora direto no microcontrolador via endpoint HTTP <code class="text-cyan-400">/test</code>.
      </p>

      <div class="grid grid-cols-2 gap-3">
        <button class="btn-actuator" onclick="triggerHardware('buzzer5v')">
          <span class="text-amber-400 font-bold block mb-1">Bip 5V (D27)</span>
          <span class="text-[10px] text-slate-400">Tom Ressonante 2.7kHz</span>
        </button>

        <button class="btn-actuator border-rose-500/30 hover:border-rose-500" onclick="triggerHardware('siren')">
          <span class="text-rose-400 font-bold block mb-1">Sirene Incêndio (D12)</span>
          <span class="text-[10px] text-slate-400">Modulação 900-2200Hz</span>
        </button>

        <button class="btn-actuator" onclick="triggerHardware('melody')">
          <span class="text-emerald-400 font-bold block mb-1">Melodia Chuva (D12)</span>
          <span class="text-[10px] text-slate-400">Jingle Natalino PWM</span>
        </button>

        <button class="btn-actuator" onclick="triggerHardware('toggle_led')">
          <span class="text-cyan-400 font-bold block mb-1">Alternar LED (D19)</span>
          <span class="text-[10px] text-slate-400">Inverte Estado Estático</span>
        </button>
      </div>

      <button class="w-full btn-action bg-slate-800 hover:bg-slate-700 text-xs py-2 mt-2" onclick="triggerHardware('auto_led')">
        Restaurar Respiração Automática do LED Verde (PWM)
      </button>
    </div>

    <div id="actuatorStatus" class="text-center text-xs font-mono py-2 text-cyan-400 h-6"></div>
  </div>
</div>
