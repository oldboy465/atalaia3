<div class="kpi-grid">
  <!-- TEMPERATURA -->
  <div class="kpi-card" style="border-color: rgba(6, 182, 212, 0.35);">
    <span class="kpi-label">Temperatura Real</span>
    <div class="kpi-value" style="color: var(--accent-cyan);" id="kpiTemp">--.- °C</div>
    <span class="kpi-subtext" id="kpiDewPoint">Orvalho: --.- °C</span>
  </div>

  <!-- UMIDADE -->
  <div class="kpi-card" style="border-color: rgba(56, 189, 248, 0.35);">
    <span class="kpi-label">Umidade Relativa</span>
    <div class="kpi-value" style="color: var(--accent-blue);" id="kpiHum">--.- %</div>
    <span class="kpi-subtext" id="kpiAbsHum">Abs: --.- g/m³</span>
  </div>

  <!-- ÍNDICE DE CALOR -->
  <div class="kpi-card" style="border-color: rgba(245, 158, 11, 0.35);">
    <span class="kpi-label">Sensação Térmica (HI)</span>
    <div class="kpi-value" style="color: var(--accent-amber);" id="kpiHeatIndex">--.- °C</div>
    <span class="kpi-subtext" id="kpiVaporPress">Pressão: --.- hPa</span>
  </div>

  <!-- GÁS MQ-135 -->
  <div class="kpi-card" style="border-color: rgba(16, 185, 129, 0.35);">
    <span class="kpi-label">Qualidade do Ar (MQ)</span>
    <div class="kpi-value" style="color: var(--accent-emerald);" id="kpiGasRaw">----</div>
    <span class="kpi-subtext" id="kpiGasPpm">PPM: ~--- ppm</span>
  </div>

  <!-- CHUVA -->
  <div class="kpi-card" style="border-color: rgba(56, 189, 248, 0.35);" id="cardRain">
    <span class="kpi-label">Sensor de Chuva</span>
    <div class="kpi-value" style="color: var(--text-muted);" id="kpiRain">SECO</div>
    <span class="kpi-subtext">Limiar ADC: 2500</span>
  </div>

  <!-- FOGO -->
  <div class="kpi-card" style="border-color: rgba(244, 63, 94, 0.35);" id="cardFlame">
    <span class="kpi-label">Risco de Incêndio</span>
    <div class="kpi-value" style="color: var(--accent-emerald);" id="kpiFlame">SEGURO</div>
    <span class="kpi-subtext" id="kpiWarmup">Calibração OK</span>
  </div>
</div>
