<div class="relative flex flex-col items-center justify-center p-2">
  <div class="relative w-48 h-48">
    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
      <!-- Fundo do Medidor -->
      <circle cx="50" cy="50" r="40" stroke="#1e293b" stroke-width="8" fill="transparent" />
      <!-- Trilho de Gradiente Ativo Dinâmico -->
      <circle id="gaugeRiskCircle" cx="50" cy="50" r="40" stroke="url(#riskGradient)" stroke-width="8" 
              fill="transparent" stroke-dasharray="251.2" stroke-dashoffset="251.2" 
              stroke-linecap="round" class="transition-all duration-1000 ease-out" />
      
      <defs>
        <linearGradient id="riskGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#06b6d4" />
          <stop offset="50%" stop-color="#f59e0b" />
          <stop offset="100%" stop-color="#ef4444" />
        </linearGradient>
      </defs>
    </svg>

    <!-- Indicador Numérico Centralizado com Efeito Glow -->
    <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
      <span id="gaugeRiskVal" class="text-3xl font-black font-mono tracking-tighter text-cyan-400 drop-shadow-[0_0_12px_rgba(6,182,212,0.8)]">0</span>
      <span class="text-[10px] font-mono uppercase tracking-widest text-slate-400 mt-1">IRI SCORE</span>
      <span id="gaugeRiskLabel" class="text-xs font-bold text-emerald-400 mt-0.5">NORMAL</span>
    </div>
  </div>
</div>
