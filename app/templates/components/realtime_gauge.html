<div style="position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 0;">
  <!-- RADAR / MEDIDOR SVG CENTRALIZADO -->
  <div style="position: relative; width: 220px; height: 220px;">
    <svg style="width: 100%; height: 100%; transform: rotate(-90deg);" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="riskGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#06b6d4" />
          <stop offset="40%" stop-color="#3b82f6" />
          <stop offset="70%" stop-color="#f59e0b" />
          <stop offset="100%" stop-color="#f43f5e" />
        </linearGradient>
      </defs>

      <!-- Trilho de Fundo -->
      <circle cx="50" cy="50" r="40" stroke="rgba(30, 41, 59, 0.7)" stroke-width="8" fill="transparent" />

      <!-- Trilho Ativo com Gradiente e Stroke-Dash -->
      <circle id="gaugeRiskCircle" cx="50" cy="50" r="40" stroke="url(#riskGradient)" stroke-width="8" 
              fill="transparent" stroke-dasharray="251.2" stroke-dashoffset="251.2" 
              stroke-linecap="round" style="transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);" />
    </svg>

    <!-- VALOR E STATUS NO CENTRO DO CÍRCULO -->
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
      <span id="gaugeRiskVal" style="font-size: 2.5rem; font-weight: 900; font-family: monospace; line-height: 1; color: var(--accent-cyan); text-shadow: 0 0 15px rgba(6, 182, 212, 0.6);">0</span>
      <span style="font-size: 0.65rem; font-family: monospace; letter-spacing: 0.12em; color: var(--text-muted); text-transform: uppercase; margin-top: 4px;">IRI SCORE</span>
      <span id="gaugeRiskLabel" style="font-size: 0.75rem; font-weight: 800; font-family: monospace; color: var(--accent-emerald); margin-top: 4px;">NORMAL</span>
    </div>
  </div>
</div>
